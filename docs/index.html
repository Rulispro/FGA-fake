<html>
<head>
<meta charset="UTF-8">
<title>BOT DASHBOARD PRO</title>

<style>
html{
  scroll-behavior:smooth;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:system-ui;
background:#1e293b;  /* gelap luar */color: #334155;
display:flex;
min-height:100vh;
overflow-x:hidden;
}



/* ================= SIDEBAR ================= */

.sidebar{
width:230px;
background: #0f172a;
color: #2563eb;
border-right: none;
box-shadow: 4px 0 15px rgba(0,0,0,0.05);
}

.logo{
font-size:22px;
font-weight:bold;
margin-bottom:40px;
background: linear-gradient(90deg, #2563eb, #3b82f6); /* Biru cerah */
-webkit-background-clip: text;
}

.menu div{
padding:12px;
border-radius:10px;
cursor:pointer;
margin-bottom:10px;
transition:.3s;
}

.menu div.active{
  background:#1e293b;
  color:white;
}

.menu div:hover{
background: #1e293b;
color: #2563eb;
}

/* ================= MAIN ================= */

.main{
flex:1;
padding:25px;
background:#a855f7;   /* ungu soft */
border-left:1px solid #93c5fd;
}

/* ================= STATS ================= */

.stats{
display:flex;
gap:15px;
margin-bottom:25px;
flex-wrap:wrap;
}

.stat{
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  padding:20px;
  transition:.3s;
}

.stat:nth-child(1){
  border-top:4px solid #3b82f6;
}

.stat:nth-child(2){
  border-top:4px solid #10b981;
}

.stat:nth-child(3){
  border-top:4px solid #f59e0b;
}
  
.stat h3{opacity:.7;font-size:14px;}
.stat span{font-size:26px;font-weight:bold;}

/* ================= FILTER ================= */

.filters{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}

select,input{
background:#141414;
border:none;
color:white;
padding:10px;
border-radius:8px;
}

/* ================= CARD ================= */

/* ================= CARD ANIMATION ================= */
.action{
  display:flex;
  align-items:center;
}

.action button{
  background:#10b981;
  border:none;
  color:white;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.action button:hover{
  background:#059669;
}
  
.card{
  display:flex;
  align-items:flex-start;  /* penting */
  gap:20px;
  padding:18px;
  border-radius:16px;
  margin-bottom:18px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

@keyframes cardReveal{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}


.card:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:
     0 0 0 1px rgba(255,255,255,.05),
     0 10px 35px rgba(0,0,0,.7),
     0 0 25px rgba(0,255,213,.15);
}

  .left{
  display:flex;
  flex-direction:column;
  width:80px;
  }

.group-img{
  
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
  margin-bottom:10px; /* jarak ke caption */
  opacity:0;
  transform:scale(.8);
  animation:imgIn .6s ease forwards;
}
.groups-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.btn-save{
  background:#10b981;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
.btn-deleted{
  background:#DC2626;
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  }
.btn-save:hover{
  background:#DC2626;
}

.btn-deleted:hover{
  background:#059669;
}
  
.action button{
  background:#ef4444;
}

.action button:hover{
  background:#dc2626;
}
@keyframes imgIn{
  to{
    opacity:1;
    transform:scale(1);
  }
}

.right{
  flex:1;
}

.left input{
margin-bottom:8px;
transform:scale(1.2);
  }
  
.group-name{
  font-size:20px;     /* lebih besar */
  font-weight:600;
  color:#1e293b;
}

.caption{
  font-size:20px;
  font-weight:600;
  color:#1e293b;
  line-height:1.6;
  margin-top:6px;
  word-break:break-word;
}
.section-title{
margin:25px 0 12px;
font-size:20px;
}

.empty{opacity:.5;margin-top:20px;}

.search{
width:220px;
}

/* MOBILE */
@media(max-width:900px){
.sidebar{display:none;}
body{flex-direction:column;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🤖 BOT PRO</div>

<div class="menu">
<div id="menuResult" onclick="showPage('result')">📌 Hasil Posting</div>
<div id="menuSchedule" onclick="showPage('schedule')">📅 Schedule xlsx</div>
<div id="menuScheduler" onclick="showPage('schedulePost')">📅 Schedule Post hasil scrape</div>
<div id="menuGroups" onclick="showPage('groups')">👥 DAFTAR Grup</div></div>
</div>


<!-- MAIN -->
<div class="main">

<!-- ===== STATS ===== -->
<div class="stats">
<div class="stat"><h3>TOTAL POSTING</h3><span id="totalPost">0</span></div>
<div class="stat"><h3>TOTAL GRUP</h3><span id="totalGroup">0</span></div>
<div class="stat"><h3>AKUN AKTIF</h3><span id="totalAccount">0</span></div>
</div>


<!-- ================= HASIL ================= -->
<div id="resultPage">

<div class="section-title">📌 HASIL POSTING</div>

<div class="filters">
<select id="accountFilter">
<option value="all">Semua Akun</option>
</select>
<input type="date" id="dateFilter">
</div>

<div id="list"></div>

</div>


<!-- ================= SCHEDULE ROW TEMPLATE xlsx ================= -->
<div id="schedulePage" style="display:none">

<div class="section-title">📅 JADWAL POSTING</div>

<div class="filters">
<select id="scheduleAccountFilter">
<option value="all">Semua Akun</option>
</select>

<input type="date" id="calendarSchedule">
</div>

<div id="schedule-list"></div>

</div>

  <!-- ================= SCHEDULE POST BARU ================= -->
<div id="schedulePostPage" style="display:none">

<div class="section-title">📅 JADWAL POSTING (GRUP TERPILIH)</div>

<div class="filters">
<select id="schedulePostAccountFilter">
<option value="all">Semua Akun</option>
</select>

<input type="date" id="calendarSchedulePost">
</div>

<div id="schedulePost-list"></div>

</div>
  

<!-- ================= GROUPS ================= -->
<div id="groupsPage" style="display:none">

<div class="section-title">👥 PILIH GRUP</div>
<div class="filters groups-header">
<div class="filters">
<select id="groupAccountFilter">
<option value="all">Semua Akun</option>
</select>
  <input type="date" id="scheduleDate">
  <button onclick="saveToSchedule()" class="btn-save">
    💾 SIMPAN GRUP 
  </button>
  <button onclick="deleteSelectedGroups()" class="btn-deleted">
🗑️ HAPUS GRUP
  </button>
    
</div>

<div id="groups-list"></div>


</div>

</div> <!-- END MAIN -->

<script>

  function toggleGroup(account, link, checked){
console.log("Update:", account, link, checked);
  }

  //fungsi simpan ke local store 
  function saveToSchedule(){

  let selected = JSON.parse(localStorage.getItem("selectedGroups") || "{}");
  const date = document.getElementById("scheduleDate").value;

  if(!date){
    alert("Pilih tanggal dulu!");
    return;
  }

  document.querySelectorAll("#groups-list input[type=checkbox]").forEach(cb=>{
    
    if(cb.checked){

      const account = cb.getAttribute("data-account");
      const link = cb.getAttribute("data-link");
      const name = cb.getAttribute("data-name");
      const photo = cb.getAttribute("data-photo");

      if(!selected[account]) selected[account] = [];

      const sudahAda = selected[account].some(
        g => g.group_link === link && g.tanggal === date
      );

      if(!sudahAda){
        selected[account].push({
          tanggal: date,
          group_link: link,
          group_name: name,
          group_photo: photo
        });
      }
    }

  });

  localStorage.setItem("selectedGroups", JSON.stringify(selected));

  // kirim ke API
  fetch("https://fga-fake.vercel.app/api/save", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(selected)
  });

  alert("✅ Masuk ke Jadwal Posting!");
  showPage("schedulePost");
    
  }

//HAPUS GRUP DI DAFTAR GRUP///
  async function deleteSelectedGroups(){

    const checkedBoxes = Array.from(
    document.querySelectorAll("#groups-list input[type=checkbox]")
  ).filter(cb => cb.checked);

  console.log("CHECKED:", checkedBoxes); // debug

  if(checkedBoxes.length === 0){
    alert("⚠️ Tidak ada grup yang dicentang!");
    return;
  }

  let res = await fetch("groups.json?" + Date.now());
  let groups = await res.json();

  checkedBoxes.forEach(cb => {

    const account = cb.dataset.account;
    const id = cb.dataset.id;

    if(!groups[account]) return;

    groups[account] = groups[account].filter(
      g => g.id !== id   // 🔥 pakai ID (lebih aman dari link)
    );

    if(groups[account].length === 0){
      delete groups[account];
    }

  });

  // 🔥 kirim ke API delete
  await fetch("https://fga-fake.vercel.app/api/delete-groups", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(groups)
  });

  alert("✅ Grup berhasil dihapus!");

  setTimeout(()=>{
    location.reload();
  },1000);
}


  //fungsi hapus di schedule post hasil scrape 
  
function deleteGroup(account, link, tanggal){

  let data = JSON.parse(localStorage.getItem("selectedGroups") || "{}");

  if(!data[account]) return;

  data[account] = data[account].filter(
    g => !(g.group_link === link && g.tanggal === tanggal)
  );

  if(data[account].length === 0){
    delete data[account];
  }

  localStorage.setItem("selectedGroups", JSON.stringify(data));

  // kirim ke server juga
  fetch("https://fga-fake.vercel.app/api/save", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  alert("✅ Grup dihapus");
  loadSchedulePost();
  }
/* ================= NAVIGATION ================= */

function showPage(page){

  // hide semua page dulu
  document.getElementById("resultPage").style.display = "none";
  document.getElementById("schedulePage").style.display = "none";
  document.getElementById("schedulePostPage").style.display = "none";
  document.getElementById("groupsPage").style.display = "none";

  // reset menu active
  document.querySelectorAll(".menu div").forEach(el=>{
    el.classList.remove("active");
  });

  // show sesuai page
  if(page==="result"){
    document.getElementById("resultPage").style.display="block";
    document.getElementById("menuResult").classList.add("active");
  }

  if(page==="schedule"){
    document.getElementById("schedulePage").style.display="block";
  }

  if(page==="schedulePost"){
  document.getElementById("schedulePostPage").style.display="block";

  const today = new Date().toISOString().slice(0,10);
  const input = document.getElementById("calendarSchedulePost");

  if(!input.value){
    input.value = today;
  }

  loadSchedulePost();
  }

  if(page==="groups"){
    document.getElementById("groupsPage").style.display="block";
    document.getElementById("menuGroups").classList.add("active");
  }
  }

  //schedule posthasil grup terpilih /hasil scrape 
  
function loadSchedulePost(){

  const list = document.getElementById("schedulePost-list");
  const dropdown = document.getElementById("schedulePostAccountFilter");
  const prevValue = dropdown.value;

  list.innerHTML = "Loading...";

  fetch("selected.json?" + Date.now())
  .then(r => r.json())
  .then(data => {

    dropdown.innerHTML = '<option value="all">Semua Akun</option>';

    Object.keys(data).forEach(acc=>{
      const o = document.createElement("option");
      o.value = acc;
      o.textContent = acc;
      dropdown.appendChild(o);
    });

    dropdown.value = prevValue || "all";

    let all = [];

    Object.keys(data).forEach(acc=>{
      data[acc].forEach(g=>{
        all.push({...g, account: acc});
      });
    });

    // filter tanggal
    const selectedDate = document.getElementById("calendarSchedulePost").value;
    if(selectedDate){
      all = all.filter(i => i.tanggal === selectedDate);
    }

    // filter akun
    const selectedAcc = dropdown.value;
    if(selectedAcc !== "all"){
      all = all.filter(i => i.account === selectedAcc);
    }

    list.innerHTML = "";

    if(all.length === 0){
      list.innerHTML = `<div class="empty">Belum ada grup dipilih</div>`;
      return;
    }

    all.forEach(item=>{
      list.innerHTML += `
<div class="card">

  <div class="left">
    <img src="${item.group_photo || 'https://via.placeholder.com/70'}" class="group-img">
  </div>

  <div class="right">
    <div class="group-name">${item.group_name}</div>
    <div style="font-size:13px;opacity:.6">
      ${item.account} • ${item.tanggal}
    </div>
  </div>

  <div class="action">
    <button onclick="deleteGroup('${item.account}','${item.group_link}','${item.tanggal}')">
      ❌
    </button>
  </div>

</div>`;
    });

  });
}

//fungsi simpan per card di schedule dari scrape grup 
function saveSingleGroup(btn){

  const card = btn.closest(".card");
  const checkbox = card.querySelector("input[type=checkbox]");

  if(!checkbox.checked){
    alert("⚠️ Centang dulu grupnya!");
    return;
  }

  const account = checkbox.dataset.account;
  const link = checkbox.dataset.link;
  const name = checkbox.dataset.name;
  const photo = checkbox.dataset.photo;

  let data = JSON.parse(localStorage.getItem("selectedGroups") || "{}");

  if(!data[account]) data[account] = [];

  data[account].push({
    group_link: link,
    group_name: name,
    group_photo: photo
  });

  localStorage.setItem("selectedGroups", JSON.stringify(data));

  alert("✅ Grup ditambahkan!");
}

/* ================= RESULT ================= */

fetch("data.json?"+Date.now())
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("list");
const dropdown=document.getElementById("accountFilter");
const dateInput=document.getElementById("dateFilter");

dateInput.value=new Date().toISOString().slice(0,10);

/* dropdown akun */
[...new Set(data.map(i=>i.account))]
.forEach(acc=>{
const o=document.createElement("option");
o.value=acc;
o.textContent=acc;
dropdown.appendChild(o);
});

/* stats */
document.getElementById("totalPost").textContent=data.length;

document.getElementById("totalGroup").textContent=
new Set(data.map(i=>i.group_name)).size;

document.getElementById("totalAccount").textContent=
new Set(data.map(i=>i.account)).size;


function render(){

container.innerHTML="";

const filtered=data.filter(item=>{

const acc=dropdown.value==="all"||item.account===dropdown.value;
const date=!dateInput.value||item.tanggal===dateInput.value;

return acc && date;
});

if(!filtered.length){
container.innerHTML=`<div class="empty">Tidak ada posting.</div>`;
return;
}

filtered.forEach((item,index)=>{
container.innerHTML+=`
<div class="card">

  <div class="left">
    <img src="${item.group_photo||'https://via.placeholder.com/70'}" class="group-img">
  </div>

  <div class="right">
    <div class="group-name">${item.group_name}</div>
    <div class="caption">${item.caption}</div>
  </div>

</div>`;
});
}

render();

dropdown.addEventListener("change",render);
dateInput.addEventListener("change",render);


});

/* ================= GROUPS ================= */

//fetch("docs/groups.json?"+Date.now())
fetch("groups.json?")
.then(r=>r.json())
.then(data=>{
console.log("DATA GROUP:", data); 
const list=document.getElementById("groups-list");
const dropdown=document.getElementById("groupAccountFilter");

/* dropdown akun */
Object.keys(data).forEach(acc=>{
const o=document.createElement("option");
o.value=acc;
o.textContent=acc;
dropdown.appendChild(o);
});

function render(){

list.innerHTML="";

const selectedAccount=dropdown.value;

let groupsToShow=[];

/* filter akun */
if(selectedAccount==="all"){
Object.keys(data).forEach(acc=>{
groupsToShow.push(...data[acc].map(g=>({...g,account:acc})));
});
}else{
groupsToShow=data[selectedAccount].map(g=>({...g,account:selectedAccount}));
}

if(!groupsToShow.length){
list.innerHTML=`<div class="empty">Tidak ada grup.</div>`;
return;
}

/* render */
groupsToShow.forEach((g,index)=>{

list.innerHTML+=`
<div class="card">

  <div class="left">
    <input type="checkbox"
  data-account="${g.account}"
  data-id="${g.id}"
  data-link="${g.link}"
  data-name="${g.name}"
  data-photo="${g.photo}"
>
<img src="${g.photo || 'https://via.placeholder.com/70'}" class="group-img">
</div>

  <div class="right">
    <div class="group-name">${g.name}</div>
  </div>

</div>
`;
});

}

render();

dropdown.addEventListener("change",render);

});
  
/* ================= SCHEDULE ================= */

fetch("schedule.json?"+Date.now())
.then(r=>r.json())
.then(scheduleData=>{

const calendar=document.getElementById("calendar");
const list=document.getElementById("schedule-list");
const accountFilter=document.getElementById("scheduleAccountFilter");

calendar.value=new Date().toISOString().slice(0,10);

const allItems=Object.values(scheduleData).flat();

[...new Set(allItems.map(i=>i.account))]
.forEach(acc=>{
const o=document.createElement("option");
o.value=acc;
o.textContent=acc;
accountFilter.appendChild(o);
});

function renderSchedule(){

list.innerHTML="";

const date=calendar.value;

if(!scheduleData[date]){
list.innerHTML=`<div class="empty">Tidak ada jadwal.</div>`;
return;
}

const filtered=scheduleData[date].filter(i=>
accountFilter.value==="all"||
i.account===accountFilter.value
);

if(!filtered.length){
list.innerHTML=`<div class="empty">Tidak ada jadwal akun ini.</div>`;
return;
}

filtered.forEach((item,index)=>{
list.innerHTML+=`
<div class="card" style="animation-delay:${index*0.05}s">

  <div class="left">
    <img src="${item.group_photo||'https://via.placeholder.com/70'}" class="group-img">
    <div class="caption">${item.caption}</div>
  </div>

  <div class="right">
    <div class="group-name">${item.group_name}</div>
  </div>

</div>`;
});

}

renderSchedule();

calendar.addEventListener("change",renderSchedule);
accountFilter.addEventListener("change",renderSchedule);

});
showPage("result");
  document.getElementById("schedulePostAccountFilter")
  .addEventListener("change", loadSchedulePost);
 
  document.getElementById("calendarSchedulePost")
  .addEventListener("change", loadSchedulePost);

  document.getElementById("scheduleDate")
  .addEventListener("change", () => {
    document.querySelectorAll("#groups-list input[type=checkbox]")
      .forEach(cb => cb.checked = false);
  });
</script>
</body>
