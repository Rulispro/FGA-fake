name: Generate Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ===============================
      # CHECKOUT REPO
      # ===============================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ===============================
      # SETUP NODE
      # ===============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===============================
      # CACHE NPM + PUPPETEER
      # ===============================
      - name: Cache npm + puppeteer
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
            node_modules
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ===============================
      # SETUP SWAP RAM
      # ===============================
      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      # ===============================
      # INSTALL DEPENDENCIES
      # ===============================
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ===============================
      # RUN SCRIPT
      # ===============================
      - name: Generate Schedule & Scrape Groups
        run: node dashboard/generateSchedule.js

      # ===============================
      # COMMIT FILES
      # ===============================
      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add package-lock.json
          git add docs/schedule.json docs/groups.json

          git diff --cached --quiet || git commit -m "Auto update schedule & lockfile"
          git push
