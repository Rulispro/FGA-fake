name: FB Post Group

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: fb-post-group
  cancel-in-progress: false
  
jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # CACHE NODE_MODULES + CHROME
      - name: Cache npm + puppeteer
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
            node_modules
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # SWAP RAM
      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Group Bot
        run: node --max-old-space-size=4096 dashboard/index.js group

      - name: Upload recordings
        uses: actions/upload-artifact@v4
        with:
          name: fb-recordings
          path: |
            *.mp4
          retention-days: 7

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data.json docs/schedule.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update dashboard data"

          # ambil update terbaru dulu
          git pull --rebase origin main

          # push ulang
          git push origin main
