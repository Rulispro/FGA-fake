name: FB Scraper + Recorder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ===============================
      # CHECKOUT REPO
      # ===============================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ===============================
      # SETUP NODE
      # ===============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===============================
      # CACHE NPM + PUPPETEER
      # ===============================
      - name: Cache npm + puppeteer
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
            node_modules
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ===============================
      # SETUP SWAP RAM
      # ===============================
      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      # ===============================
      # INSTALL DEPENDENCIES
      # ===============================
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ===============================
      # INSTALL FFMPEG
      # ===============================
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y ffmpeg -qq > /dev/null

      # ===============================
      # RUN SCRAPER + RECORDER
      # ===============================
      - name: Scrape Facebook Groups
        run: node dashboard/scrapegroups.js
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      # ===============================
      # UPLOAD VIDEO
      # ===============================
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrape-video
          path: video.mp4

      # ===============================
      # COMMIT JSON
      # ===============================
      - name: Commit Groups
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add docs/groups.json

          git diff --cached --quiet || git commit -m "Auto update groups"

          git push
