name: Scrape Groups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # ✅ GANTI NAMA STEP
      - name: Scrape Facebook Groups
        run: node dashboard/scrapegroups.js

      # ✅ COMMIT HASIL SCRAPE SAJA
      - name: Commit Groups
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add docs/groups.json package-lock.json

          git diff --cached --quiet || git commit -m "Auto update groups"
          git push
